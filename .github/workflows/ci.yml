name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: banking_intelligence_test
      POSTGRES_USER: banking_admin
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      PLATFORM_API_KEY: test-platform-api-key

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: banking_intelligence_test
          POSTGRES_USER: banking_admin
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banking_admin -d banking_intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev --group etl

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format . --check

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Build dbt warehouse
        run: uv run dbt build --project-dir warehouse --profiles-dir warehouse

      - name: Run tests
        run: uv run pytest

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build API Docker image
        run: docker build --tag banking-intelligence-api:ci .

      - name: Smoke test API Docker image
        run: docker run --rm banking-intelligence-api:ci python -c "import banking_intelligence"

